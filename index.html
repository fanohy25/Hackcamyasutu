<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8"/>
  <title>Malagasy memera</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    :root {
      --c1:#8A2BE2;
      --c2:#FF6B6B;
      --c3:#4ECDC4;
      --white:#fff;
      --glass:rgba(255,255,255,0.1);
    }
    
    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
    }
    
    body {
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(-45deg,var(--c1),var(--c2),var(--c3));
      background-size:400% 400%;
      animation:bgShift 8s ease infinite;
      color:var(--white);
      font-family:'Segoe UI',sans-serif;
      padding:20px;
    }
    
    @keyframes bgShift {
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }
    
    .container {
      width:100%;
      max-width:420px;
      background:var(--glass);
      backdrop-filter:blur(20px);
      border-radius:24px;
      border:1px solid rgba(255,255,255,0.2);
      padding:40px 30px;
      box-shadow:0 25px 50px rgba(0,0,0,0.3);
      animation:popIn 0.6s ease;
    }
    
    @keyframes popIn {
      from{opacity:0;transform:scale(0.9) translateY(30px)}
      to{opacity:1;transform:scale(1) translateY(0)}
    }
    
    .logo {
      width:80px;
      height:80px;
      background:linear-gradient(135deg,var(--c2),var(--c3));
      border-radius:50%;
      margin:0 auto 25px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:36px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }
    
    h1 {
      text-align:center;
      font-size:26px;
      margin-bottom:10px;
    }
    
    h2 {
      text-align:center;
      font-size:20px;
      margin-bottom:20px;
      font-weight:500;
    }
    
    p {
      text-align:center;
      line-height:1.6;
      margin-bottom:20px;
      opacity:0.9;
    }
    
    .conditions {
      background:rgba(0,0,0,0.2);
      border-radius:16px;
      padding:20px;
      margin:20px 0;
      max-height:200px;
      overflow-y:auto;
    }
    
    .conditions h3 {
      font-size:16px;
      margin-bottom:12px;
    }
    
    .conditions ul {
      list-style:none;
      font-size:14px;
      line-height:1.8;
    }
    
    .conditions li::before {
      content:"• ";
      color:var(--c3);
      font-weight:bold;
    }
    
    .checkbox-wrapper {
      display:flex;
      align-items:center;
      gap:12px;
      margin:20px 0;
      cursor:pointer;
    }
    
    .checkbox-wrapper input[type="checkbox"] {
      width:22px;
      height:22px;
      accent-color:var(--c2);
      cursor:pointer;
    }
    
    .checkbox-wrapper label {
      font-size:15px;
      cursor:pointer;
    }
    
    .input-group {
      margin:25px 0;
    }
    
    .input-group label {
      display:block;
      margin-bottom:10px;
      font-size:15px;
    }
    
    .input-group input {
      width:100%;
      padding:16px 20px;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,0.15);
      color:var(--white);
      font-size:18px;
      text-align:center;
      letter-spacing:2px;
      outline:none;
      transition:all 0.3s;
    }
    
    .input-group input::placeholder {
      color:rgba(255,255,255,0.5);
    }
    
    .input-group input:focus {
      background:rgba(255,255,255,0.25);
      box-shadow:0 0 20px rgba(255,255,255,0.2);
    }
    
    .error {
      color:#ff6b6b;
      font-size:14px;
      text-align:center;
      margin-top:10px;
      display:none;
    }
    
    .btn {
      width:100%;
      padding:18px;
      border:none;
      border-radius:16px;
      background:linear-gradient(135deg,#ff7b7b,#ff3860);
      color:var(--white);
      font-size:18px;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 10px 30px rgba(255,56,96,0.4);
      transition:all 0.3s;
      margin-top:20px;
    }
    
    .btn:hover:not(:disabled) {
      transform:translateY(-3px);
      box-shadow:0 15px 40px rgba(255,56,96,0.6);
    }
    
    .btn:disabled {
      opacity:0.5;
      cursor:not-allowed;
    }
    
    .loading {
      display:none;
      text-align:center;
      padding:40px;
    }
    
    .spinner {
      width:60px;
      height:60px;
      border:4px solid rgba(255,255,255,0.3);
      border-top-color:var(--white);
      border-radius:50%;
      margin:0 auto 20px;
      animation:spin 1s linear infinite;
    }
    
    @keyframes spin {
      to{transform:rotate(360deg)}
    }
    
    .loading p {
      font-size:18px;
    }
    
    .progress {
      width:100%;
      height:6px;
      background:rgba(255,255,255,0.2);
      border-radius:3px;
      margin:20px 0;
      overflow:hidden;
    }
    
    .progress-bar {
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--c2),var(--c3));
      border-radius:3px;
      transition:wid
